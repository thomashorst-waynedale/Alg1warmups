<!DOCTYPE html>
<html>
<head>
    <title>Algebra Pulse - Student</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 20px; background: #f0f2f5; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: inline-block; width: 90%; max-width: 500px; margin-top: 50px; }
        #q-text { color: #333; margin-bottom: 30px; min-height: 60px; }
        input, button { padding: 15px; font-size: 1.1rem; margin: 10px; width: 85%; border-radius: 10px; border: 2px solid #ddd; outline: none; }
        button { background: #007bff; color: white; border: none; cursor: pointer; transition: 0.2s; font-weight: bold; }
        button:hover { background: #0056b3; transform: translateY(-2px); }
        .sent { color: #28a745; font-weight: bold; display: none; }
        #debug { font-size: 0.8rem; color: #888; margin-top: 20px; font-family: monospace; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="q-text">Connecting to teacher...</h2>
        <div id="input-area"></div>
        <p id="msg" class="sent">Response Sent!</p>
        <div id="debug">Initializing...</div>
    </div>

    <script>
        const webAppUrl = "https://script.google.com/macros/s/AKfycbySC3wGViOMC_Pt3uo7qry-XK_bI4Jr_HgynM2eF_vRq0dlrLx03V5S0DQn1FJqVAlFvQ/exec";
        let currentQId = null;
        let questions = [];

        const debugEl = document.getElementById('debug');
        function log(msg) { debugEl.innerText = "System Status: " + msg; }

        // 1. Fetch the master question list safely
        fetch('questions.json')
            .then(r => r.json())
            .then(data => { 
                questions = data; 
                log("Loaded " + questions.length + " questions from Vault.");
            })
            .catch(e => {
                log("ERROR: Could not load questions.json. Check for typos/commas!");
            });

        // 2. Check for active question updates every 3 seconds
        setInterval(async () => {
            if (questions.length === 0) return; // Wait until questions are loaded

            try {
                // Fetch the active ID from Google (no-cors removed to allow reading)
                const response = await fetch(webAppUrl + "?t=" + Date.now());
                const activeId = await response.text();
                const cleanId = activeId.trim();

                log("Google says active ID is: [" + cleanId + "]");

                if (cleanId && cleanId !== "0" && cleanId !== currentQId) {
                    currentQId = cleanId;
                    const q = questions.find(item => item.id == cleanId);
                    
                    if (q) {
                        renderQuestion(q);
                    } else {
                        log("ERROR: Teacher pushed ID " + cleanId + ", but it's not in the JSON!");
                    }
                }
            } catch (e) { 
                log("Attempting to connect to Google Engine..."); 
            }
        }, 3000);

        function renderQuestion(q) {
            document.getElementById('msg').style.display = 'none';
            document.getElementById('q-text').innerText = q.q;
            const area = document.getElementById('input-area');
            area.innerHTML = '';
            
            if(q.type === 'numeric') {
                area.innerHTML = '<input type="number" id="ans" placeholder="Enter number..."><br><button onclick="submitAnswer()">Send Answer</button>';
            } else {
                q.options.forEach(opt => {
                    area.innerHTML += `<button onclick="submitAnswer('${opt}')">${opt}</button>`;
                });
            }
        }

        async function submitAnswer(val) {
            const ans = val || document.getElementById('ans').value;
            if(!ans) return;
            
            document.getElementById('input-area').innerHTML = '<h3>Submitting...</h3>';
            
            await fetch(webAppUrl, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify({ action: "submitAnswer", questionId: currentQId, answer: ans })
            });
            
            document.getElementById('msg').style.display = 'block';
        }
    </script>
</body>
</html>
