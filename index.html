<!DOCTYPE html>
<html>
<head>
    <title>Algebra Pulse - Student</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 20px; background: #f0f2f5; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: inline-block; width: 90%; max-width: 500px; margin-top: 50px; }
        #q-text { color: #333; margin-bottom: 30px; min-height: 60px; }
        input, button { padding: 15px; font-size: 1.1rem; margin: 10px; width: 85%; border-radius: 10px; border: 2px solid #ddd; outline: none; }
        button { background: #007bff; color: white; border: none; cursor: pointer; transition: 0.2s; font-weight: bold; }
        button:hover { background: #0056b3; transform: translateY(-2px); }
        .sent { color: #28a745; font-weight: bold; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="q-text">Waiting for teacher to start...</h2>
        <div id="input-area"></div>
        <p id="msg" class="sent">Response Sent!</p>
    </div>

    <script>
        const webAppUrl = "https://script.google.com/macros/s/AKfycbyiyDAuvKuoyYQ517HSHE69O4t3X85X73E9zOuVnS-9CuahJbUsuOAawGwlu0TWcaJwog/exec";
        let currentQId = null;
        let questions = [];

        // Fetch the master question list from your repo
        fetch('questions.json').then(r => r.json()).then(data => { questions = data; });

        // Check for active question updates
        setInterval(async () => {
            try {
                const response = await fetch(webAppUrl);
                const activeId = await response.text();
                if (activeId && activeId !== currentQId) {
                    currentQId = activeId;
                    const q = questions.find(item => item.id == activeId);
                    if (q) renderQuestion(q);
                }
            } catch (e) { console.log("Connection sync..."); }
        }, 2000);

        function renderQuestion(q) {
            document.getElementById('msg').style.display = 'none';
            document.getElementById('q-text').innerText = q.q;
            const area = document.getElementById('input-area');
            area.innerHTML = '';
            if(q.type === 'numeric') {
                area.innerHTML = '<input type="number" id="ans" placeholder="Enter number..."><button onclick="submit()">Send Answer</button>';
            } else {
                q.options.forEach(opt => {
                    area.innerHTML += `<button onclick="submit('${opt}')">${opt}</button>`;
                });
            }
        }

        async function submit(val) {
            const ans = val || document.getElementById('ans').value;
            if(!ans) return;
            document.getElementById('input-area').innerHTML = '<h3>Submitting...</h3>';
            await fetch(webAppUrl, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify({ action: "submitAnswer", questionId: currentQId, answer: ans })
            });
            document.getElementById('msg').style.display = 'block';
        }
    </script>
</body>
</html>
