<!DOCTYPE html>
<html>
<head>
    <title>TA Dashboard - Control</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; margin: 0; background: #f8f9fa; }
        #sidebar { width: 300px; background: #343a40; color: white; height: 100vh; overflow-y: auto; padding: 20px; }
        #main { flex-grow: 1; padding: 40px; text-align: center; }
        .q-btn { display: block; width: 100%; padding: 10px; margin-bottom: 5px; text-align: left; background: #495057; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .q-btn:hover { background: #007bff; }
        .viz-btn { padding: 10px 20px; margin: 10px; font-size: 1rem; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 5px; }
        canvas { max-width: 800px; margin: 20px auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div id="sidebar">
        <h3>Question Bank</h3>
        <div id="list"></div>
    </div>
    <div id="main">
        <h1 id="active-title">Select a Warm-up</h1>
        <div id="controls"></div>
        <canvas id="chart"></canvas>
    </div>

    <script>
        const webAppUrl = "https://script.google.com/macros/s/AKfycbySC3wGViOMC_Pt3uo7qry-XK_bI4Jr_HgynM2eF_vRq0dlrLx03V5S0DQn1FJqVAlFvQ/exec";
        let chart;

        fetch('questions.json').then(r => r.json()).then(data => {
            const list = document.getElementById('list');
            data.forEach(q => {
                const b = document.createElement('button');
                b.className = 'q-btn';
                b.innerText = `${q.id}. [${q.std}] ${q.q.substring(0,25)}...`;
                b.onclick = () => activate(q);
                list.appendChild(b);
            });
        });

  async function activate(q) {
    document.getElementById('active-title').innerText = q.q;
    const ctrl = document.getElementById('controls');
    
    // Clear old buttons and show status
    ctrl.innerHTML = '<h3>Question pushed to Chromebooks!</h3>';
    
    // Create buttons for the visualizations allowed for this question
    q.viz.forEach(v => {
        ctrl.innerHTML += `<button class="viz-btn" onclick="renderChart('${v}')">Show ${v.toUpperCase()}</button>`;
    });

    // THE FIX: We are now sending the ID via the URL (?action=setQ&id=...)
    // This is much more reliable on school wifi than the old POST method.
    console.log("Sending signal for question ID:", q.id);
    await fetch(webAppUrl + "?action=setQ&id=" + q.id);
}

        async function renderChart(type) {
            if(chart) chart.destroy();
            const ctx = document.getElementById('chart').getContext('2d');
            
            // THIS IS THE TEACHER CODE: It fetches REAL student data from your sheet
            try {
                const response = await fetch(webAppUrl + "?action=getResults");
                const stats = await response.json();

                chart = new Chart(ctx, {
                    type: 'bar', // Using bar for histograms and categorical data
                    data: {
                        labels: Object.keys(stats), // The unique student answers
                        datasets: [{
                            label: 'Class Responses',
                            data: Object.values(stats), // The count of each answer
                            backgroundColor: '#007bff'
                        }]
                    },
                    options: {
                        scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                    }
                });
            } catch (e) {
                console.error("Error fetching data:", e);
                alert("No responses found yet. Check if students have submitted!");
            }
        }
    </script>
</body>
</html>
